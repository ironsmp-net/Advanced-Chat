name: AdvancedChat
version: '${version}'

main: org.ramki.advancedChat.AdvancedChat
api-version: '1.21'
load: POSTWORLD
folia-supported: true

authors: [ ue_rami ]

softdepend: [ PlaceholderAPI ]

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.1

commands:
  advchat:
    description: AdvancedChat commands
    usage: /advchat <reload>
    aliases: [ advancedchat ]
  mute:
    description: Mute a player across the network
    usage: /mute <player> <number> <minute|hour|day> <reason>
    permission: advancedchat.staff
  unmute:
    description: Unmute a player across the network
    usage: /unmute <player>
    permission: advancedchat.staff

permissions:
  advchat.reload:
    description: Allows use of /advchat reload
    default: op
  advchat.minimessage:
    description: Allows MiniMessage formatting in chat messages
    default: false
  advchat.colorcodes:
    description: Allows legacy color codes in chat messages
    default: false
  advchat.bypasscooldown:
    description: Allows bypassing the chat cooldown
    default: false
  advancedchat.staff:
    description: Staff permission for /mute and /unmute
    default: op
