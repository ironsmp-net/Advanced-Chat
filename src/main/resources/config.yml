# AdvancedChat Configuration
#
# Placeholders:
# %player% = the player's name
# %displayname% = the player's display name
# %message% = the chat message
# %world% = the world name of the player's current world
# %server% = the server name (configurable below)
#
# PlaceholderAPI placeholders are also supported (e.g. %player_health%, %vault_prefix%)
#
# MiniMessage formatting is supported in the chat format
# Examples: <green>, <bold>, <gradient:red:blue>, <hover:show_text:'hello'>
# See https://docs.advntr.dev/minimessage/format.html
#
# To reload: /advchat reload or /advancedchat reload
# Permission: advchat.reload

chat-format: "%player%: %message%"

# Server name used for the %server% placeholder.
# When database sync is enabled this also identifies this server in the shared chat table,
# so EVERY server in the network MUST have a unique server-name.
server-name: "server"

# When true, this server publishes chat messages to the shared database and reads incoming
# messages from other servers (that also have chat-sync: true).
# When false, this server does not send its chat to the network and does not see chat from
# other servers. Mute sync still works independently of this toggle.
chat-sync: true

cooldown:
  enabled: true
  seconds: 1.5
  message: "<dark_red>⚠ <dark_grey>You must wait %number% seconds before chatting again."

# Shown to a muted player when they try to chat. Placeholders:
# %days%, %hours%, %minutes%, %reason%, %muter%, %player%
mute:
  chat-blocked-message: "<red>You are muted (%days% Days, %hours% Hours, %minutes% Minutes)!\n<red>Reason: <yellow>(%reason%)"
  sync-interval-ticks: 20

database:
  enabled: false
  host: "127.0.0.1"
  port: 3306
  database: "advancedchat"
  username: ""
  password: ""
  table: "advchat_messages"
  mute-table: "advchat_mutes"
  poll-interval-ticks: 10
